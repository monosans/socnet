line-length = 100
output-prefer-rule-codes = true
preview = true
target-version = "py314"

[format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[lint]
future-annotations = true
ignore = [
  "ANN401",
  "COM812",
  "CPY001",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D106",
  "D107",
  "PLR0914",
  "RUF105",
  "RUF201",
  "S308",
  "S311",
  "pytest-fixture-autouse",
]
select = ["ALL"]
unfixable = ["RUF027", "T"]

[lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]
"socnet/*/migrations/*" = ["RUF012", "RUF039", "SLF001"]
"tests/*" = ["FBT001", "PLR2004", "S101"]

[lint.flake8-gettext]
extend-function-names = [
  "pgettext",
  "gettext_lazy",
  "pgettext_lazy",
  "npgettext",
  "ngettext_lazy",
  "npgettext_lazy",
]

[lint.flake8-self]
ignore-names = ["_meta", "_name_", "_value_"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-type-checking]
exempt-modules = []
runtime-evaluated-decorators = [
  "ninja.NinjaAPI.api_operation",
  "ninja.NinjaAPI.delete",
  "ninja.NinjaAPI.get",
  "ninja.NinjaAPI.patch",
  "ninja.NinjaAPI.post",
  "ninja.NinjaAPI.put",
]
strict = true

[lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false

[lint.pydocstyle]
convention = "google"

[lint.pyupgrade]
keep-runtime-typing = true
