[package]
name = "socnet-rs"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
name = "socnet_rs"

[dependencies]
ammonia = "=4.2.4"
compact_str = "=0.10.0"
pulldown-cmark = {
  version = "=0.13.5",
  default-features = false,
  features = [
    "html",
    "simd",
  ]
}
pyo3 = "=0.30.1"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
