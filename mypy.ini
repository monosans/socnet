[mypy]
python_version = 3.14
disallow_any_unimported = True
warn_unreachable = True
allow_redefinition = True
enable_error_code =
  deprecated,
  exhaustive-match,
  explicit-override,
  ignore-without-code,
  possibly-undefined,
  redundant-expr,
  redundant-self,
  truthy-bool,
  truthy-iterable,
  unimported-reveal,
  unused-awaitable,
  unused-ignore
strict_equality_for_none = True
strict = True
untyped_calls_exclude = allauth, channels, environ, factory
plugins = mypy_django_plugin.main

[mypy-socnet.messenger.consumers,socnet.messenger.routing]
disallow_untyped_calls = False

[mypy-allauth.*,channels.*,channels_redis.*,environ.*]
follow_untyped_imports = True

[mypy.plugins.django-stubs]
django_settings_module = config.settings.test
