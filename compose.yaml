name: socnet
services:
  django:
    build:
      dockerfile: ./docker/django/Dockerfile
      pull: true
    depends_on:
      - postgres
    env_file: ./.env
    init: true
    networks:
      - django-postgres
  postgres:
    image: docker.io/postgres:18
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    init: true
    networks:
      - django-postgres
    pull_policy: always
networks:
  django-postgres:
