{% if page_range %}
  <ul class="pagination justify-content-center mt-3 mb-0">
    {% for page in page_range %}
      {% if page == object_list.paginator.ELLIPSIS %}
        <li class="page-item">
          <div class="page-link">{{ page }}</div>
        </li>
      {% elif page == object_list.number %}
        <li class="page-item active">
          <div class="page-link">{{ page }}</div>
        </li>
      {% else %}
        <li class="page-item">
          <a class="page-link" href="{% querystring page=page %}">{{ page }}</a>
        </li>
      {% endif %}
    {% endfor %}
  </ul>
{% endif %}
