repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        exclude_types:
          - rust
      - id: check-symlinks
      - id: check-xml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace
  - repo: https://github.com/thibaudcolas/pre-commit-stylelint
    rev: a43d64a23287d2dc2e02289bd3b2cb0da5eddfb1 # frozen: v17.16.0
    hooks:
      - id: stylelint
        language: node
        args:
          - --fix=lax
        additional_dependencies:
          - stylelint@17.16.0
          - stylelint-config-standard@40.0.0
          - stylelint-config-recess-order@7.10.0
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: f26bd20264b5e50a1b1755cc2585b3464ca5c3b9 # frozen: v1.10.0
    hooks:
      - id: tombi-format
        exclude: ^(?:.*Cargo.lock|uv.lock)$
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: 9d4396bc7213c9392d3ee75974bbf2bfa34bfe29 # frozen: v0.77.0
    hooks:
      - id: oxfmt
        language: node
        types_or:
          - text
        args:
          - --no-error-on-unmatched-pattern
        additional_dependencies:
          - oxfmt@0.77.0
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 5ccd385680292c5e5b10bedf0a3e509b5e6e9da8 # frozen: 1.33.0
    hooks:
      - id: django-upgrade
        args:
          - --target-version
          - "6.1"
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5 # frozen: v0.17.4
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/djlint/djLint
    rev: 328ae8ca553d7bf0c4123dec95ccb3dfda4f28ff # frozen: v1.49.9
    hooks:
      - id: djlint-reformat
      - id: djlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
        args:
          - --no-progress
          - --persona=pedantic
