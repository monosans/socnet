repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        exclude_types:
          - rust
      - id: check-symlinks
      - id: check-xml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace
  # - repo: https://github.com/thibaudcolas/pre-commit-stylelint
  #   rev: v17.9.0
  #   hooks:
  #     - id: stylelint
  #       language: node
  #       args:
  #         - --fix=lax
  #       additional_dependencies:
  #         - stylelint@17.9.0
  #         - stylelint-config-standard@40.0.0
  #         - stylelint-config-recess-order@7.7.0
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 7c1739b6be770a7ccc8170a43993ccbb8e19dfb9 # frozen: v1.8.9
    hooks:
      - id: tombi-format
        exclude: ^(?:.*Cargo.lock|uv.lock)$
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273 # frozen: v3.9.10
    hooks:
      - id: prettier
        args:
          - --object-wrap=collapse
          - --no-config
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 5ccd385680292c5e5b10bedf0a3e509b5e6e9da8 # frozen: 1.33.0
    hooks:
      - id: django-upgrade
        args:
          - --target-version
          - "6.1"
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/djlint/djLint
    rev: 1399b56bfc493191c39ff1a525a8ab9c11201cd3 # frozen: v1.46.6
    hooks:
      - id: djlint-reformat
      - id: djlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
