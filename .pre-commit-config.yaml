repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        exclude_types:
          - rust
      - id: check-symlinks
      - id: check-xml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace
  - repo: https://github.com/thibaudcolas/pre-commit-stylelint
    rev: 2396e2ed32cb8dda1f2bf1414e2aff8eb47e3f0b # frozen: v18.1.0
    hooks:
      - id: stylelint
        language: node
        args:
          - --fix
        additional_dependencies:
          - bootstrap@5.3.9
          - stylelint@18.1.0
          - stylelint-config-standard@41.1.0
          - stylelint-config-recess-order@7.10.1
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 1066584123cce44a99b4818c2b2c4a7e732ff8e9 # frozen: v1.11.3
    hooks:
      - id: tombi-format
        exclude: ^(?:.*Cargo.lock|uv.lock)$
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: b082b2f0f22aabef0f5cea2bd183dd85c08ba9ca # frozen: v0.79.0
    hooks:
      - id: oxfmt
        language: node
        types_or:
          - text
        args:
          - --no-error-on-unmatched-pattern
        additional_dependencies:
          - oxfmt@0.79.0
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 5ccd385680292c5e5b10bedf0a3e509b5e6e9da8 # frozen: 1.33.0
    hooks:
      - id: django-upgrade
        args:
          - --target-version
          - "6.1"
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10 # frozen: v0.17.6
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/djlint/djLint
    rev: ba83fa585bc2e2bf853a8eb50e297c14f0a652b5 # frozen: v1.54.0
    hooks:
      - id: djlint-reformat
      - id: djlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c7d31dc612dffdd4d3b2f2b88b9660d3ab057ee8 # frozen: v1.33.1
    hooks:
      - id: zizmor
        args:
          - --no-progress
          - --persona=pedantic
