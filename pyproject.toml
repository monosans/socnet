[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "channels==4.3.2",
  "channels-redis==4.3",
  "django-allauth[mfa]==65.21.0",
  "django-bootstrap5==26.4",
  "django-cleanup==9",
  "django-environ==0.14.0",
  "django-filter==26.2",
  "django-htmx==1.29.0",
  "django-logentry-admin==1.1",
  "django-ninja==1.7.1",
  "django-stubs-ext==6.1.2",
  "django[argon2]==6.1.2",
  "docutils==0.23",
  "granian==2.8.7",
  "orjson==3.13.0",
  "pillow==13.0.0",
  "psycopg[pool]==3.3.6",
  "sentry-sdk[django]==2.73.0",
  "socnet-rs",
  "uvloop==0.23.0; implementation_name=='cpython' and (sys_platform=='darwin' or sys_platform=='linux')",
]
optional-dependencies.local = [
  "app[test]",
  "debugpy==1.8.22",
  "django-debug-toolbar==8.0.0",
  "django-extra-checks==0.17.0",
  "watchfiles==1.3.0",
]
optional-dependencies.production = [
  "psycopg[c]==3.3.6",
  "redis[hiredis]==8.1.0",
]
optional-dependencies.test = [
  "covdefaults==2.3",
  "django-coverage-plugin==3.2.2",
  "factory-boy==3.3.3",
  "psycopg[binary]==3.3.6",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pytest-django==4.14.0",
  "pytest-django-autocheck==0.3.0",
]
optional-dependencies.test-ci = [
  "app[test]",
  "pytest-github-actions-annotate-failures==0.4.2",
]

[dependency-groups]
dev = [
  "djlint==1.47.1",
  "ruff==0.17.3",
  { include-group = "typecheck" },
]
typecheck = [
  # mypy follows the imports of config/urls.py and the tests, and the Django
  # plugin loads the database backend, so these are installed too.
  "django-debug-toolbar==8.0.0",
  "django-stubs==6.1.2",
  "factory-boy==3.3.3",
  "mypy==2.4.1",
  "psycopg[binary]==3.3.6",
  "pytest==9.2.0",
  "pytest-django==4.14.0",
  "types-pillow==10.2.0.20240822",
]

[tool.uv]
exclude-newer = "3 days"
package = false

[tool.uv.sources]
socnet-rs = { path = "socnet_rs", editable = false }
